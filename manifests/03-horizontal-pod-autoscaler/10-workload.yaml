# Provides the CPU-requested workload that the HPA will scale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-demo
  namespace: aks-hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-demo
  template:
    metadata:
      labels:
        app: cpu-demo
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cpu-demo
          image: YOUR_ACR.azurecr.io/aks-hpa-demo:v2
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              # HPA measures CPU utilization as a percentage of this 50m request.
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
# The load generator sends traffic to this Service, which distributes it to pods.
apiVersion: v1
kind: Service
metadata:
  name: cpu-demo
  namespace: aks-hpa-demo
spec:
  selector:
    app: cpu-demo
  ports:
    - name: http
      port: 3000
      targetPort: http
