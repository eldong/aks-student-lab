# Requests four replicas to demonstrate partial creation when quota is exhausted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-workload
  namespace: aks-governance-demo
spec:
  # The namespace quota permits only three total pods, including defaulted-pod.
  replicas: 4
  selector:
    matchLabels:
      app: quota-workload
  template:
    metadata:
      labels:
        app: quota-workload
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weather-api
          image: YOUR_ACR.azurecr.io/aks-weather-api:v1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 3000
