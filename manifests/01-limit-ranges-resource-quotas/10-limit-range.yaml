# Sets default, minimum, and maximum resources for containers in this namespace.
apiVersion: v1
kind: LimitRange
metadata:
  name: container-resource-limits
  namespace: aks-governance-demo
spec:
  limits:
    - type: Container
      # Applied when a container omits its limits.
      default:
        cpu: 300m
        memory: 128Mi
      # Applied when a container omits its requests.
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      min:
        cpu: 50m
        memory: 32Mi
      max:
        cpu: 500m
        memory: 256Mi
