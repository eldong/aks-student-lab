# Intentionally omits resources so the LimitRange injects defaults.
apiVersion: v1
kind: Pod
metadata:
  name: defaulted-pod
  namespace: aks-governance-demo
  labels:
    app: governance-demo
spec:
  nodeSelector:
    kubernetes.io/os: linux
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: weather-api
      image: YOUR_ACR.azurecr.io/aks-weather-api:v1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      ports:
        - name: http
          containerPort: 3000
      # No resources block: inspect the live pod to see the injected values.
