# Recreate mode can replace pods so recommended requests are applied at admission.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: weather-api-vpa
  namespace: aks-vpa-demo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weather-api
  updatePolicy:
    # Watch the pod names change after this mode is applied.
    updateMode: "Recreate"
  resourcePolicy:
    containerPolicies:
      - containerName: weather-api
        controlledValues: RequestsOnly
        controlledResources:
          - cpu
          - memory
        minAllowed:
          cpu: 25m
          memory: 32Mi
        maxAllowed:
          cpu: 100m
          memory: 128Mi
