# Off mode calculates recommendations without changing or replacing pods.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: weather-api-vpa
  namespace: aks-vpa-demo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weather-api
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: weather-api
        # VPA may recommend requests only, bounded by this allowed range.
        controlledValues: RequestsOnly
        controlledResources:
          - cpu
          - memory
        minAllowed:
          cpu: 25m
          memory: 32Mi
        maxAllowed:
          cpu: 100m
          memory: 128Mi
